---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: cruxify
  labels:
    app.kubernetes.io/name: cruxify-backend
spec:
  # SQLite has exactly one writer. Recreate makes sure two pods never open the file at once.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cruxify-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cruxify-backend
      # For a Prometheus that discovers pods by annotation; a ServiceMonitor can use the
      # "management" port instead.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: /actuator/prometheus
    spec:
      # No API token in the pod, a fixed unprivileged user, the runtime's seccomp profile.
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backend
          image: ghcr.io/paulmaurovich/cruxify-backend:0.24.1@sha256:dbe07deaa6214e030fddfaed045f2109d3e66f030f03d257efb772541cfc3603
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            # Health and metrics, never behind the ingress.
            - name: management
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 3
            failureThreshold: 40
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
        # Tomcat and the JVM write their scratch files here; the root file system is read-only.
        - name: tmp
          emptyDir: {}
