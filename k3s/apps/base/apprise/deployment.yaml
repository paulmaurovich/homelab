---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apprise
  namespace: apprise
spec:
  selector:
    matchLabels:
      app: apprise
  template:
    metadata:
      labels:
        app: apprise
    spec:
      containers:
        - name: apprise
          image: caronc/apprise:1.5@sha256:c5ea17408c10fd84c8fdb05a421114a1a677b16343c274bf9b1a55701b530829
          resources:
            requests:
              memory: "200Mi"
            limits:
              memory: "200Mi"
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: apprise-config
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: apprise-data
              mountPath: /config
      volumes:
        - name: apprise-data
          persistentVolumeClaim:
            claimName: apprise-data
