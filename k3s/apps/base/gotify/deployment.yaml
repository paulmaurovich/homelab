---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gotify
  namespace: gotify
spec:
  selector:
    matchLabels:
      app: gotify
  template:
    metadata:
      labels:
        app: gotify
    spec:
      containers:
        - name: gotify
          image: ghcr.io/gotify/server:3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: config
            - secretRef:
                name: db-secrets
            - secretRef:
                name: basic-auth
          volumeMounts:
            - name: gotify-data
              mountPath: /app/data
      volumes:
        - name: gotify-data
          persistentVolumeClaim:
            claimName: gotify-data
