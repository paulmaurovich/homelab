---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-hub
  namespace: beszel
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beszel-hub
  template:
    metadata:
      labels:
        app: beszel-hub
    spec:
      containers:
        - name: beszel-hub
          image: ghcr.io/henrygd/beszel/beszel:0.18.8@sha256:99181067e5a46b3147231f456114280a8119eed371808bce79e6e7f173946975
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - secretRef:
                name: beszel-hub-secrets
            - configMapRef:
                name: beszel-hub-config
          volumeMounts:
            - name: beszel-hub-data
              mountPath: /beszel_data
      volumes:
        - name: beszel-hub-data
          persistentVolumeClaim:
            claimName: beszel-hub-data
