---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beszel-hub
  namespace: beszel
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: beszel-hub
  template:
    metadata:
      labels:
        app: beszel-hub
    spec:
      containers:
        - name: beszel-hub
          image: ghcr.io/henrygd/beszel/beszel:0.21.0@sha256:020d80f5974e66356e6d6440736952edc9b9ea59978ac9f98418b5fb643dc0e2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8090
          envFrom:
            - secretRef:
                name: beszel-hub-secrets
            - configMapRef:
                name: beszel-hub-config
          volumeMounts:
            - name: beszel-hub-data
              mountPath: /beszel_data
      volumes:
        - name: beszel-hub-data
          persistentVolumeClaim:
            claimName: beszel-hub-data
